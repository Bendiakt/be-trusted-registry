name: Production Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_stripe_check:
        description: 'Run Stripe checkout session validation (live/test/any mode from script env)'
        required: false
        default: false
        type: boolean
      monitor_insecure_tls:
        description: 'Use curl --insecure (for local TLS issues only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor production API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run production monitor script
        env:
          BACKEND_URL: https://api.mydd.work
          MAX_HEALTH_MS: '1500'
          # Business metrics aggregates data (cache warm/cold variance). A single
          # cold sample legitimately lands ~1s on Railway, so 1000ms sat on the
          # noise floor and produced false-positive alerts. 2000ms keeps headroom
          # while still catching genuine degradation.
          MAX_BUSINESS_METRICS_MS: '2000'
          CURL_MAX_TIME: '15'
          CURL_RETRY_COUNT: '2'
          RUN_STRIPE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.run_stripe_check || '0' }}
          MONITOR_INSECURE_TLS: ${{ github.event_name == 'workflow_dispatch' && inputs.monitor_insecure_tls || '0' }}
        run: |
          bash scripts/monitor-prod.sh

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          payload="{\"text\":\"[ALERT] ${WORKFLOW} failed on ${REPO}@${REF_NAME} - ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}\"}"
          curl -sS -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${payload}" >/dev/null
