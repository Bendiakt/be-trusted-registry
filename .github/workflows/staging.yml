name: Staging CI

# Triggers on every push to `staging` branch and on PRs targeting it.
# Mirrors the full main CI suite but also runs a post-deploy health probe
# against the Railway staging service URL.

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  # ── 1. Backend unit tests ────────────────────────────────────────────────────
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: |
          node --test tests/unit.test.js
          node --test tests/encryption.test.js
          node --test tests/fraud.test.js
          node --test tests/webhook.test.js
          node --test tests/validators.test.js
          node --test tests/lib.test.js
          node --test tests/pac.test.js
          node --test tests/pacSupervision.test.js
          node --test tests/payments.test.js
          node --test tests/disputes.test.js
          node --test tests/earnings.test.js

  # ── 2. Backend lint / syntax ─────────────────────────────────────────────────
  lint:
    name: Backend lint & syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check syntax (all JS files)
        working-directory: backend
        run: |
          find . -name "*.js" -not -path "*/node_modules/*" \
            -exec node --check {} \; && echo "Syntax OK"

  # ── 3. Frontend unit tests ───────────────────────────────────────────────────
  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  # ── 4. E2E tests ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Playwright tests
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium + OS deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test --reporter=github
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: e2e/playwright-report/
          retention-days: 7

  # ── 5. Staging health probe (post-deploy, BLOCKING) ──────────────────────────
  # This job runs ONLY on push to staging (not on PRs — no deploy happens yet).
  # When STAGING_API_URL is set in GitHub repo vars, this job is fully blocking:
  # any subsequent "merge to main" gate should require this job to pass.
  #
  # ⚠️  ACTIVATION: add STAGING_API_URL to GitHub → Settings → Variables
  #     Value: https://api-staging.mydd.work  (or your Railway staging URL)
  #     Once set, every push to staging will health-check the live service.
  #     Until then, the job is skipped — not silently passing.
  staging-health:
    name: Staging service health check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.STAGING_API_URL != ''
    needs: [unit-tests, lint, frontend-tests]

    steps:
      - name: Confirm staging URL is configured
        run: |
          echo "Probing staging at: ${{ vars.STAGING_API_URL }}"
          echo "This job is BLOCKING — failure here must be resolved before merging to main."

      - name: Diagnose staging service
        # Quick diagnostic before waiting — helps identify root-cause immediately.
        # HTTP 000        → DNS/connection failure (not provisioned)
        # HTTP 200 on /   → frontend is running, not backend (wrong service URL)
        # HTTP 404 on /   → backend catch-all (routes may not be mounted)
        # HTTP 200 on /api/health → backend healthy
        id: diagnose
        run: |
          BASE="${{ vars.STAGING_API_URL }}"
          ROOT_CODE=$(curl -s -o /tmp/root_body.txt -w "%{http_code}" --max-time 10 "$BASE/" 2>/dev/null || echo "000")
          HEALTH_CODE=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" --max-time 10 "$BASE/api/health" 2>/dev/null || echo "000")
          LIVE_CODE=$(curl -s -o /tmp/live_body.txt -w "%{http_code}" --max-time 10 "$BASE/api/health/live" 2>/dev/null || echo "000")

          ROOT_BODY=$(head -c 120 /tmp/root_body.txt 2>/dev/null || echo "")
          HEALTH_BODY=$(head -c 200 /tmp/health_body.txt 2>/dev/null || echo "")

          echo "=== Staging diagnostic ==="
          echo "  GET /             → HTTP $ROOT_CODE  | body: $ROOT_BODY"
          echo "  GET /api/health   → HTTP $HEALTH_CODE | body: $HEALTH_BODY"
          echo "  GET /api/health/live → HTTP $LIVE_CODE"

          # Detect Railway's own "Application not found" infrastructure 404.
          # This means the Railway service does not exist — different from a
          # running backend that returns 404 for unknown routes.
          RAILWAY_NOT_FOUND=false
          if grep -q "Application not found" /tmp/root_body.txt 2>/dev/null || \
             grep -q "Application not found" /tmp/health_body.txt 2>/dev/null; then
            RAILWAY_NOT_FOUND=true
          fi

          if [[ "$ROOT_CODE" == "000" ]] || [[ "$RAILWAY_NOT_FOUND" == "true" ]]; then
            echo "::warning::DIAGNOSIS: Railway service does not exist at $BASE."
            echo "::warning::The URL is not associated with any deployed Railway service."
            echo "::warning::ACTION: Follow docs/railway-staging-setup.md to provision the backend staging service,"
            echo "::warning::then update STAGING_API_URL in GitHub → Settings → Variables with the correct URL."
            echo "::warning::Until then, remove STAGING_API_URL from GitHub vars to skip this job automatically."
            echo "diagnosis=not_provisioned" >> $GITHUB_OUTPUT
          elif [[ "$ROOT_CODE" == "200" && "$HEALTH_CODE" == "404" ]]; then
            echo "::error::DIAGNOSIS: Root returns 200 but /api/health returns 404."
            echo "::error::This looks like the FRONTEND service — STAGING_API_URL points to the wrong Railway service."
            echo "::error::Fix: update STAGING_API_URL to the backend service URL (check Railway Dashboard → backend service → Settings → Networking)."
            echo "diagnosis=wrong_service" >> $GITHUB_OUTPUT
          elif [[ "$HEALTH_CODE" == "404" ]]; then
            echo "::error::DIAGNOSIS: /api/health returns 404. Backend is running but routes are not mounted."
            echo "::error::Check Railway Dashboard → staging backend service → Settings:"
            echo "::error::  Root directory must be: backend"
            echo "::error::  Start command must be: node server.js"
            echo "diagnosis=routes_missing" >> $GITHUB_OUTPUT
          elif [[ "$HEALTH_CODE" == "200" ]]; then
            echo "DIAGNOSIS: Service is already healthy."
            echo "diagnosis=healthy" >> $GITHUB_OUTPUT
          else
            echo "DIAGNOSIS: Service responds but is not yet healthy (HTTP $HEALTH_CODE). Will poll."
            echo "diagnosis=starting" >> $GITHUB_OUTPUT
          fi

      - name: Wait for healthy staging service (poll up to 5 min)
        # Skip polling if already known healthy or definitively broken.
        if: |
          steps.diagnose.outputs.diagnosis == 'starting' ||
          steps.diagnose.outputs.diagnosis == 'routes_missing'
        # Replaces the fixed sleep + single-shot curl with a polling loop.
        # Scenarios handled:
        #   HTTP 000 (DNS/connection) → service not provisioned → warning + skip
        #   HTTP 200                  → service healthy → proceed with assertions
        #   HTTP 5xx (crash / deploy) → keep polling until healthy or timeout
        # Max wait: 300 s (10 polls × 30 s). Railway deploys typically finish in 90–150 s.
        id: wait_healthy
        run: |
          URL="${{ vars.STAGING_API_URL }}/api/health"
          MAX=300
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -le $MAX ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null || echo "000")
            echo "  [${ELAPSED}s] HTTP $HTTP_CODE"

            if [[ "$HTTP_CODE" == "000" ]]; then
              echo "::warning::Service unreachable (DNS/connection). Provision Railway staging service first."
              echo "provisioned=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Service healthy after ${ELAPSED}s."
              echo "provisioned=true" >> $GITHUB_OUTPUT
              echo "healthy=true"     >> $GITHUB_OUTPUT
              exit 0
            fi

            # 5xx or other — keep polling
            ELAPSED=$((ELAPSED + INTERVAL))
            [ $ELAPSED -le $MAX ] && sleep $INTERVAL
          done

          # Timed out — service responds but never returned 200
          echo "::error::Staging service did not become healthy within ${MAX}s (last HTTP $HTTP_CODE)."
          echo "provisioned=true"  >> $GITHUB_OUTPUT
          echo "healthy=false"     >> $GITHUB_OUTPUT
          exit 1

      - name: Health check — liveness
        if: |
          (steps.diagnose.outputs.diagnosis == 'healthy') ||
          (steps.wait_healthy.outputs.provisioned == 'true' && steps.wait_healthy.outputs.healthy == 'true')
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            "${{ vars.STAGING_API_URL }}/api/health")
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'status not ok: {d}'
          print(f'PASS: liveness OK, uptimeSec={d.get(\"uptimeSec\",\"?\")}')
          "

      - name: Health check — readiness (DB)
        if: |
          (steps.diagnose.outputs.diagnosis == 'healthy') ||
          (steps.wait_healthy.outputs.provisioned == 'true' && steps.wait_healthy.outputs.healthy == 'true')
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            "${{ vars.STAGING_API_URL }}/api/health/ready")
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ready') is True, f'ready != true: {d}'
          assert d.get('db') == 'ok', f'db != ok: {d}'
          print('PASS: readiness probe ready=true, db=ok')
          "

      - name: Auth endpoint sanity check
        if: |
          (steps.diagnose.outputs.diagnosis == 'healthy') ||
          (steps.wait_healthy.outputs.provisioned == 'true' && steps.wait_healthy.outputs.healthy == 'true')
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST "${{ vars.STAGING_API_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-probe@test.io","password":"wrong"}')
          echo "Auth endpoint status: $STATUS"
          [[ "$STATUS" == "401" || "$STATUS" == "400" ]] && echo "PASS: auth endpoint active" || \
            (echo "FAIL: unexpected status $STATUS" && exit 1)

      - name: Staging service not provisioned — reminder
        if: |
          steps.diagnose.outputs.diagnosis == 'not_provisioned' ||
          steps.wait_healthy.outputs.provisioned == 'false'
        run: |
          echo "======================================================================"
          echo "  STAGING SERVICE NOT REACHABLE — provision Railway staging first"
          echo "  Follow docs/railway-staging-setup.md then push to staging again."
          echo "======================================================================"
          # Not a hard failure — service provisioning is a manual ops step.
          # Once reachable, all health assertions above will run and block on failure.
