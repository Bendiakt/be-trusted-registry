name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: |
          node --test tests/unit.test.js
          node --test tests/encryption.test.js
          node --test tests/fraud.test.js
          node --test tests/webhook.test.js
          node --test tests/validators.test.js
          node --test tests/lib.test.js
          node --test tests/pac.test.js

  test:
    name: Backend lint & health check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check syntax (all JS files)
        working-directory: backend
        run: |
          find . -name "*.js" -not -path "*/node_modules/*" \
            -exec node --check {} \; && echo "Syntax OK"

      - name: Verify required env vars documented
        run: |
          grep -q "JWT_SECRET" backend/.env.example || \
            (echo "FAIL: JWT_SECRET missing from .env.example" && exit 1)
          grep -q "STRIPE_SECRET_KEY" backend/.env.example || \
            (echo "FAIL: STRIPE_SECRET_KEY missing from .env.example" && exit 1)
          echo "Env vars documented OK"

  production-health:
    name: Production health check
    runs-on: ubuntu-latest
    # Only run on push to main (not on PRs from forks without secrets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Health check
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            https://api.mydd.work/api/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'status not ok: {d}'
          print(f'PASS: health OK, uptimeSec={d.get(\"uptimeSec\",\"?\")}')
          "

      - name: Readiness probe check (DB connectivity)
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            https://api.mydd.work/api/health/ready)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ready') is True, f'ready != true: {d}'
          assert d.get('db') == 'ok', f'db != ok: {d}'
          print('PASS: readiness probe ready=true, db=ok')
          "

      - name: Verify auth endpoint is live
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST https://api.mydd.work/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-probe@test.io","password":"wrong"}')
          echo "Auth endpoint status: $STATUS"
          [[ "$STATUS" == "401" || "$STATUS" == "400" ]] && echo "PASS: auth endpoint active" || \
            (echo "FAIL: unexpected status $STATUS" && exit 1)

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

  e2e-tests:
    name: E2E Playwright tests
    runs-on: ubuntu-latest
    # Run on every push/PR — no secrets needed (all API calls are mocked)
    needs: [frontend-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium + OS deps
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test --reporter=github
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  railway-config-guard:
    name: Railway config integrity check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate railway.toml has not been tampered with
        run: |
          python3 - << 'PY'
          import sys

          with open("railway.toml") as f:
              content = f.read()

          errors = []

          # Build must use Nixpacks or Railpack (not Docker)
          if 'builder = "NIXPACKS"' not in content and 'builder = "RAILPACK"' not in content:
              errors.append("FAIL: railway.toml builder is not NIXPACKS or RAILPACK")

          # Start command must target the backend Node.js server (directly or via npm script)
          if 'node server.js' not in content and 'start:preprod' not in content and 'npm run start' not in content:
              errors.append("FAIL: railway.toml startCommand does not target backend/server.js")

          # Health check must point to our API
          if '/api/health' not in content:
              errors.append("FAIL: railway.toml healthcheckPath is not /api/health")

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)

          print("PASS: railway.toml integrity OK")
          PY

      - name: Validate per-service railway.toml files (monorepo)
        run: |
          python3 - << 'PY'
          import sys, os

          errors = []

          # backend/railway.toml — must start the Node.js server with migration
          backend_path = "backend/railway.toml"
          if os.path.exists(backend_path):
              with open(backend_path) as f:
                  bc = f.read()
              if 'builder = "NIXPACKS"' not in bc and 'builder = "RAILPACK"' not in bc:
                  errors.append(f"FAIL: {backend_path} builder is not NIXPACKS or RAILPACK")
              # Accept direct node call or npm script that wraps migration + node
              if 'node' not in bc and 'npm run start' not in bc:
                  errors.append(f"FAIL: {backend_path} startCommand does not reference node or npm run start")
              if '/api/health' not in bc:
                  errors.append(f"FAIL: {backend_path} healthcheckPath is not /api/health")
              print(f"PASS: {backend_path} validated")
          else:
              print(f"INFO: {backend_path} not present — root railway.toml is authoritative")

          # frontend/railway.toml — must run a build step
          frontend_path = "frontend/railway.toml"
          if os.path.exists(frontend_path):
              with open(frontend_path) as f:
                  fc = f.read()
              if 'builder = "NIXPACKS"' not in fc and 'builder = "RAILPACK"' not in fc:
                  errors.append(f"FAIL: {frontend_path} builder is not NIXPACKS or RAILPACK")
              if 'npm run build' not in fc:
                  errors.append(f"FAIL: {frontend_path} buildCommand does not run npm build")
              print(f"PASS: {frontend_path} validated")
          else:
              print(f"INFO: {frontend_path} not present — skipping frontend config check")

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify .railwayignore blocks sensitive paths
        run: |
          python3 - << 'PY'
          import sys

          with open(".railwayignore") as f:
              content = f.read()

          required_patterns = [".env", "backups/", "*.log"]
          errors = []
          for p in required_patterns:
              if p not in content:
                  errors.append(f"FAIL: .railwayignore is missing pattern: {p}")

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)

          print("PASS: .railwayignore covers all required patterns")
          PY
