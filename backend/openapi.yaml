openapi: 3.1.0
info:
  title: MyDD API
  version: 1.0.0
  description: |
    REST API for the MyDD supplier certification platform.
    Authentication uses httpOnly JWT cookies (set by POST /api/auth/login).
    All mutating requests require the `X-CSRF-Token` header matching the
    `csrf_token` cookie (double-submit CSRF protection).
  contact:
    name: B&E Consult FZCO
    url: https://mydd.work
    email: support@mydd.work
  license:
    name: Proprietary

servers:
  - url: https://mydd.work
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Registration, login, token refresh, 2FA
  - name: Companies
    description: Company profile management
  - name: Certifications
    description: Public certificate verification
  - name: PAC
    description: Physical Audit Controller missions
  - name: Admin
    description: Admin-only management endpoints
  - name: Registry
    description: Public supplier registry
  - name: Payments
    description: Stripe checkout and billing portal
  - name: API Keys
    description: Manage programmatic access keys for the MyDD REST API
  - name: Webhooks
    description: Register HTTPS endpoints to receive real-time certification events
  - name: Health
    description: Liveness and readiness probes

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: httpOnly JWT access token (set by login)

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials
      required: [error]

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:   { type: string, example: email }
              message: { type: string, example: Invalid email address }
      required: [error, errors]

    User:
      type: object
      properties:
        id:    { type: integer, example: 42 }
        name:  { type: string,  example: Alice Dupont }
        email: { type: string, format: email }
        role:  { type: string, enum: [company, pac, trader, admin] }

    Company:
      type: object
      properties:
        id:               { type: integer }
        name:             { type: string }
        companyName:      { type: string }
        sector:           { type: string }
        country:          { type: string }
        website:          { type: string, format: uri }
        status:           { type: string, enum: [pending, active, suspended] }
        certificationLevel: { type: integer, enum: [0, 1, 2, 3] }

    CertInfo:
      type: object
      properties:
        level:       { type: integer }
        status:      { type: string }
        grantedAt:   { type: string, format: date-time }
        expiresAt:   { type: string, format: date-time }
        daysLeft:    { type: integer }
        expiringSoon: { type: boolean }
        expired:     { type: boolean }

    Mission:
      type: object
      properties:
        id:          { type: integer }
        company_id:  { type: integer }
        company_name: { type: string }
        location:    { type: string }
        type:        { type: string }
        description: { type: string }
        fee:         { type: number }
        status:      { type: string, enum: [available, assigned, completed, cancelled] }
        outcome:     { type: string, enum: [pass, fail, inconclusive], nullable: true }

  responses:
    Unauthorized:
      description: Authentication required — no valid session cookie
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient permissions for this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request body — see error message
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:

  # ── Auth ────────────────────────────────────────────────────────────────────

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string, minLength: 2, maxLength: 100 }
                email:    { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                role:     { type: string, enum: [company, pac, trader], default: company }
      responses:
        '200':
          description: Registered — verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in and receive JWT cookies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: |
            Success — JWT set as httpOnly cookie.
            If 2FA is enabled returns `{ requires2fa: true, tempToken }` instead.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                  - type: object
                    properties:
                      requires2fa: { type: boolean, example: true }
                      tempToken:   { type: string }
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Account locked (too many failed attempts)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and clear JWT cookies
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Silently rotate access token using httpOnly refresh_token cookie
      responses:
        '200':
          description: New access token set as cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '401':
          description: Refresh token invalid or expired — re-login required

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link (always returns 200)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset link sent (if email is registered)

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password updated
        '400':
          description: Token invalid or expired

  /api/auth/csrf-token:
    get:
      tags: [Auth]
      summary: Seed the csrf_token cookie (call once on app startup)
      responses:
        '200':
          description: csrf_token cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/auth/2fa/setup:
    get:
      tags: [Auth]
      summary: Generate TOTP secret + QR code (admin/PAC only)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Secret and QR code data URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:  { type: string }
                  qr:      { type: string, description: data:image/png;base64,... }
                  message: { type: string }

  /api/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Confirm first TOTP code and enable 2FA
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: 2FA enabled
        '400':
          description: Invalid code

  /api/auth/2fa/validate:
    post:
      tags: [Auth]
      summary: Validate TOTP during login (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tempToken, token]
              properties:
                tempToken: { type: string }
                token:     { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: TOTP validated — JWT cookies issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid code or expired temp token

  # ── Companies ────────────────────────────────────────────────────────────────

  /api/companies/me:
    get:
      tags: [Companies]
      summary: Get current user's company profile + cert info
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: { $ref: '#/components/schemas/Company' }
                  user:    { $ref: '#/components/schemas/User' }

  /api/companies/register:
    post:
      tags: [Companies]
      summary: Create or update company profile
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country]
              properties:
                name:        { type: string }
                industry:    { type: string }
                sector:      { type: string }
                country:     { type: string }
                description: { type: string }
                website:     { type: string, format: uri }
      responses:
        '200':
          description: Company upserted
        '400': { description: Validation error }
        '403': { description: Email not verified }

  # ── Certifications ───────────────────────────────────────────────────────────

  /api/verify/{id}:
    get:
      tags: [Certifications]
      summary: Public certificate verification page data
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Company + certInfo
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Company' }
                  - type: object
                    properties:
                      certInfo: { $ref: '#/components/schemas/CertInfo' }
        '404': { description: Company not found }

  # ── Registry ─────────────────────────────────────────────────────────────────

  /api/registry:
    get:
      tags: [Registry]
      summary: Search certified companies (public)
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search term (name, sector, country)
        - in: query
          name: country
          schema: { type: string }
        - in: query
          name: level
          schema: { type: integer, enum: [1, 2, 3] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Paginated company list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Company' }
                  pagination:
                    type: object
                    properties:
                      page:  { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      pages: { type: integer }

  # ── PAC ───────────────────────────────────────────────────────────────────────

  /api/pac/missions:
    get:
      tags: [PAC]
      summary: List available and assigned missions (PAC role)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Mission list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mission' }

  /api/pac/missions/{id}/accept:
    post:
      tags: [PAC]
      summary: Accept an available mission
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Mission accepted }
        '409': { description: Already assigned }

  /api/pac/missions/{id}/complete:
    post:
      tags: [PAC]
      summary: Submit mission report and outcome
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_text, outcome]
              properties:
                report_text: { type: string, minLength: 10 }
                outcome:     { type: string, enum: [pass, fail, inconclusive] }
      responses:
        '200': { description: Mission completed }
        '400': { description: Validation error }

  # ── Admin ─────────────────────────────────────────────────────────────────────

  /api/admin/companies/{id}/level:
    patch:
      tags: [Admin]
      summary: Set company certification level
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: integer, enum: [0, 1, 2, 3] }
      responses:
        '200': { description: Level updated, cert PDF emailed }
        '403': { description: Blocked company }
        '404': { description: Company not found }

  /api/admin/companies/{id}/suspend:
    patch:
      tags: [Admin]
      summary: Suspend or unsuspend a company
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspend]
              properties:
                suspend: { type: boolean }
                reason:  { type: string }
      responses:
        '200': { description: Status updated }

  # ── Payments ─────────────────────────────────────────────────────────────────

  /api/payments/history:
    get:
      tags: [Payments]
      summary: Get payment history for the authenticated company
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer }
                        amount_usd:  { type: string, example: '499.00' }
                        currency:    { type: string, example: usd }
                        status:      { type: string, enum: [pending, completed, failed, refunded] }
                        plan_id:     { type: string, example: level1 }
                        plan_label:  { type: string }
                        created_at:  { type: string, format: date-time }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── API Keys ──────────────────────────────────────────────────────────────────

  /api/keys:
    get:
      tags: [API Keys]
      summary: List all API keys for the authenticated user
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: List of API keys (raw key is never returned here)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:           { type: integer }
                        prefix:       { type: string, example: mydd_lk_a1b2c3 }
                        name:         { type: string, example: Production backend }
                        scopes:       { type: array, items: { type: string } }
                        rate_limit:   { type: integer }
                        last_used_at: { type: string, format: date-time, nullable: true }
                        created_at:   { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [API Keys]
      summary: Create a new API key (raw key shown once)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:      { type: string, maxLength: 80, example: Production backend }
                scopes:    { type: array, items: { type: string } }
                rateLimit: { type: integer, minimum: 1, maximum: 600 }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Key created — store the `key` value immediately, it will not be shown again
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:        { type: integer }
                  prefix:    { type: string, example: mydd_lk_a1b2c3 }
                  name:      { type: string }
                  scopes:    { type: array, items: { type: string } }
                  key:       { type: string, description: Raw key — shown only once }
                  createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limit exceeded (10 keys/hour) }

  /api/keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Key not found }

  # ── Webhooks ──────────────────────────────────────────────────────────────────

  /api/webhooks:
    get:
      tags: [Webhooks]
      summary: List all registered webhook endpoints
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: List of webhook endpoints with delivery stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:                { type: integer }
                        url:               { type: string, format: uri }
                        events:            { type: array, items: { type: string } }
                        active:            { type: boolean }
                        description:       { type: string, nullable: true }
                        deliveries_total:  { type: integer }
                        deliveries_success:{ type: integer }
                        created_at:        { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Webhooks]
      summary: Register a new webhook endpoint (signing secret shown once)
      description: |
        All webhook requests are signed with HMAC-SHA256. Verify on your end:
        ```
        X-MyDD-Signature: sha256=<HMAC-SHA256(body, secret)>
        ```
        Events: `cert.status_changed`, `cert.issued`, `cert.expired`, `cert.revoked`
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: Must be HTTPS
                  example: https://your-server.com/webhook
                events:
                  type: array
                  items:
                    type: string
                    enum: [cert.status_changed, cert.issued, cert.expired, cert.revoked]
                  default: [cert.status_changed]
                description:
                  type: string
                  maxLength: 200
                  nullable: true
      responses:
        '201':
          description: Endpoint registered — store the `secret` immediately, it will not be shown again
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:          { type: integer }
                  url:         { type: string }
                  events:      { type: array, items: { type: string } }
                  active:      { type: boolean }
                  secret:      { type: string, description: Signing secret — shown only once }
                  created_at:  { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limit exceeded (20 endpoints/hour) }

  /api/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Endpoint deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Endpoint not found }

  /api/webhooks/{id}/ping:
    post:
      tags: [Webhooks]
      summary: Send a test ping to a webhook endpoint
      description: Delivers a real HTTP request to the endpoint URL with event type `ping`. Response includes actual delivery status code.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Ping result
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:        { type: string }
                  success:    { type: boolean }
                  statusCode: { type: integer, nullable: true }
                  error:      { type: string, nullable: true }
                  event:      { type: string, example: ping }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Endpoint not found or inactive }

  # ── Health ────────────────────────────────────────────────────────────────────

  /api/health:
    get:
      tags: [Health]
      summary: Full health check (memory, uptime, node version)
      responses:
        '200':
          description: Health details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string, example: ok }
                  uptimeSec: { type: integer }
                  memory:
                    type: object
                    properties:
                      rss:       { type: integer }
                      heapUsed:  { type: integer }
                      heapTotal: { type: integer }

  /api/health/live:
    get:
      tags: [Health]
      summary: Liveness probe (process is running)
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  alive:     { type: boolean }
                  uptimeSec: { type: integer }

  /api/health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (DB reachable)
      responses:
        '200':
          description: Ready
        '503':
          description: Database unreachable
