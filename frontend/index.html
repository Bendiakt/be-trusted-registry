<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyDD — Trusted Supplier Certification</title>

    <!-- Primary meta -->
    <meta name="description" content="MyDD is the trusted supplier certification platform. Verify suppliers across 3 levels — document review, full KYC, and on-site PAC inspection." />
    <meta name="keywords" content="supplier certification, due diligence, KYC, AML, supplier verification, B&E, trusted registry, PAC inspection, Dubai, trade compliance" />
    <meta name="author" content="MyDD" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mydd.work/" />
    <meta property="og:title" content="MyDD — Trusted Supplier Certification" />
    <meta property="og:description" content="Certify your suppliers across 3 levels: document review, full KYC, and on-site PAC inspection. Trusted by traders worldwide." />
    <meta property="og:image" content="https://mydd.work/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="MyDD" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mydd.work/" />
    <meta name="twitter:title" content="MyDD — International Supplier Certification" />
    <meta name="twitter:description" content="MyDD — certify your suppliers in under 24h. Bronze, Silver and Gold levels." />
    <meta name="twitter:image" content="https://mydd.work/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://mydd.work/" />

    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#C9A84C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyDD" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Content Security Policy
         script-src: only our own hashed/bundled scripts (Vite adds nonces in dev)
         connect-src: API on same origin; Stripe payment redirects are server-side
         img-src:     self + data URIs (inline SVGs) + HTTPS for OG/partner logos
         style-src:   unsafe-inline needed for Tailwind JIT-injected styles
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               connect-src 'self';
               img-src 'self' data: https:;
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               frame-src 'none';
               object-src 'none';
               base-uri 'self';
               form-action 'self'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
