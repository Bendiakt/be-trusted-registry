<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#9A7B2E"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C22"/>
      <stop offset="50%" style="stop-color:#C9A84C"/>
      <stop offset="100%" style="stop-color:#C9A84C22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff08" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Gold glow orb -->
  <circle cx="600" cy="315" r="260" fill="#C9A84C" opacity="0.04" filter="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#goldH)"/>

  <!-- Logo mark -->
  <rect x="120" y="200" width="72" height="72" rx="16" fill="url(#gold)"/>
  <text x="156" y="252" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="40" font-weight="900" fill="#111">M</text>

  <!-- Brand name -->
  <text x="212" y="244" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">MyDD</text>
  <text x="212" y="268" font-family="Arial, sans-serif" font-size="14" fill="#555555" letter-spacing="3">MY DUE DILIGENCE · BY B&amp;E CONSULT</text>

  <!-- Divider -->
  <rect x="120" y="300" width="960" height="1" fill="#1f1f1f"/>

  <!-- Main headline -->
  <text x="120" y="370" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Certified Supplier</text>
  <text x="120" y="432" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
    <tspan fill="url(#gold)">Registry</tspan>
    <tspan fill="#ffffff"> for Global Trade</tspan>
  </text>

  <!-- Sub-line -->
  <text x="120" y="484" font-family="Arial, sans-serif" font-size="22" fill="#666666">3 Certification Levels · 6 Languages · Instant Verification</text>

  <!-- Bottom right: trust badge -->
  <rect x="920" y="490" width="260" height="48" rx="8" fill="#C9A84C14" stroke="#C9A84C44" stroke-width="1"/>
  <text x="1050" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#C9A84C" font-weight="700" letter-spacing="1">✓ B&amp;E CONSULT FZCO · DUBAI</text>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#goldH)"/>
</svg>
